name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Full production build. db:migrate is a no-op without DATABASE_URL
      # (the PGLite fallback applies migrations at runtime), so it needs no
      # secrets. This is the strongest gate: it fails if the app can't ship.
      - name: Build
        run: npm run build
